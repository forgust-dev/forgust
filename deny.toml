# cargo-deny: licenses and advisories (ADR-0007: every dependency must be MIT-compatible)

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Reviewed 2026-11-07; no fixed versions exist. Revisit at every milestone.
ignore = [
    # rsa "Marvin" timing attack: affects private-key RSA operations. Forgust only
    # verifies RSA client keys (public-key ops); its SSH host key is ed25519.
    { id = "RUSTSEC-2023-0071", reason = "no private-key RSA operations" },
    # bincode unmaintained: used by syntect to load its bundled syntax dumps.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained, not vulnerable; via syntect" },
    # yaml-rust unmaintained: via syntect
    { id = "RUSTSEC-2024-0320", reason = "unmaintained, not vulnerable; via syntect" },
    # crypto-bigint 0.5 timing variability (via pgp 0.21, the latest): Forgust only
    # verifies commit signatures with public keys; it holds no OpenPGP secrets.
    { id = "RUSTSEC-2026-0387", reason = "public-key verification only; via pgp" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
