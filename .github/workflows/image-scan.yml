name: Image scan

# Vulnerabilities are published after an image is released: every week, scan
# `latest` (its Debian packages and the crates in the binary); findings show in
# the repository's Security tab.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # moved by hand, with the one in release.yml
  TRIVY: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the login above: credentials for ghcr.io and nothing else
      - name: Scan the latest image
        run: |
          mkdir -m 777 "$RUNNER_TEMP/trivy"
          docker run --rm -e DOCKER_CONFIG=/docker -v "$HOME/.docker/config.json:/docker/config.json:ro" \
            -v "$RUNNER_TEMP/trivy:/out" "$TRIVY" image \
            --image-src remote --scanners vuln --ignore-unfixed \
            --format sarif --output /out/image.sarif "$IMAGE:latest"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/trivy/image.sarif
          category: image
