name: Bench

# Runs on the dedicated bench host only (ADR-0008); numbers from shared runners
# are not comparable. Register that machine as a self-hosted runner labelled `bench`.
#
# Manual only until that runner exists: a push or a schedule would queue a job no
# runner can take ("no runner matching self-hosted, bench"). Once it is registered,
# restore these triggers:
#   push:
#     branches: [main]
#   schedule:
#     - cron: "17 2 * * *" # nightly: adds the chromium fixture
on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: [self-hosted, bench]
    env:
      BASELINE: bench/baselines/bench-host.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --release -p forgust-server -p forgust-bench
      - name: Run (regression gate vs stored baseline)
        run: bench/run.sh
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/results/
