[env]
# Every `#[sqlx::test]` pool borrows from one shared pool of 20 connections per
# test binary, and each test (a full server with its workers) may hold 5: more
# than 4 tests at once starve each other into `PoolTimedOut` (and 500s from the
# server under test). Overridable: RUST_TEST_THREADS=8 cargo test.
RUST_TEST_THREADS = { value = "4", force = false }
