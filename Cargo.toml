[workspace]
resolver = "3"
members = ["crates/*", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/forgust-dev/forgust"
rust-version = "1.94"
publish = false

[workspace.dependencies]
forgust-db = { path = "crates/forgust-db" }
forgust-storage = { path = "crates/forgust-storage" }
forgust-ci-config = { path = "crates/forgust-ci-config" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "chrono", "json", "uuid"] }
rand = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.23"
moka = { version = "0.12", features = ["future"] }
ipnet = { version = "2", features = ["serde"] }
