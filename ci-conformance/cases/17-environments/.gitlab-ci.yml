stages: [build, deploy]
build:
  stage: build
  script: [make]
review:
  stage: deploy
  script: [deploy]
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://$CI_COMMIT_REF_SLUG.example.com
    on_stop: stop_review
    auto_stop_in: 1 week
stop_review:
  stage: deploy
  script: [teardown]
  when: manual
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
production:
  stage: deploy
  script: [deploy]
  environment:
    name: production
    deployment_tier: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
