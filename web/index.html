<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the tab icon follows the browser's color scheme; without media support the last one wins -->
    <link rel="icon" href="/src/assets/brand/favicon-dark.ico" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/src/assets/brand/favicon-light.ico" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/src/assets/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/api/v1/highlight.css" />
    <script>
      // apply the stored theme before first paint (no light flash for dark users)
      try { var t = localStorage.getItem("forgust.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <style>
      /* the page's color (styles.css --bg-page) from the first frame, before the stylesheet
         (in development it comes with the scripts); :where() lets styles.css override it */
      :where(html) { background: #f9f7f4; }
      @media (prefers-color-scheme: dark) { :where(html:not([data-theme="light"])) { background: #0d0e12; } }
      :where(html[data-theme="dark"]) { background: #0d0e12; }
    </style>
    <title>Forgust</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
