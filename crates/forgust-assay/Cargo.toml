[package]
name = "forgust-assay"
description = "The Smart View's engine (assay): maps a repository into blocks, the links between them and the people who know them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# the `assay` command; without it, only the library (what the server calls)
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "assay"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
globset = "0.4"
saphyr = "0.3.4"
saphyr-parser = "0.3.3"
toml = "1"
clap = { version = "4.6", features = ["derive"], optional = true }
